# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: valheim
  name:
    ar: فالهايم
    en: Valheim
  description:
    ar: سيرفر فالهايم في ماب فايكنق مفتوحة، تبدأ فيها بفأس خشبي وتنتهي بقاعدة على البحر. احتطب، وابنِ، واصطد، وواجهوا البوسات معًا. الماب والمودات وقواعد اللعب كلها تحت تحكمك من اللوحة، والكروس بلاي يتيح لأصحابك على Xbox و PS5 و Switch 2 الدخول معك بكود.
    en: Valheim dedicated servers in an open Viking world you enter with a wooden axe and leave with a hall on the coast. Chop, build, hunt, and take the bosses down together. The world, the mods and the rules are yours to control from the panel, and crossplay lets friends on Xbox, PS5 and Switch 2 join with a code.
  tagline:
    ar: ابنِ قاعدتك واهزم البوسات مع أصحابك على PC و Xbox و PS5 و Switch 2، ومابك بإدارتك
    en: Build your hall and take down the bosses with friends on PC, Xbox, PS5 and Switch 2, in your world, by your rules
  category: survival
  logo: assets/logo.webp
  banner: assets/banner.webp
  extensions:
    - kind: mods
      sources:
        - thunderstore

resources:
  minMemoryMb: 4096
  recommendedMemoryMb: 8192
  minDiskMb: 8192
  playersPerMemoryGb: 3
  maxRecommendedPlayers: 10

container:
  image: serverkgg/valheim
  runtime:
    platform: linux
    installBudgetMinutes: 15
    bootBudgetMinutes: 8
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 2456
      protocol: udp
      mirror: true
      name:
        ar: فالهايم
        en: Valheim
      hint:
        ar: من القائمة الرئيسية اختر Join Game، ثم تبويب Servers وزر Add server، والصق العنوان كما يظهر.
        en: From the main menu pick Join Game, open the Servers tab, press Add server, and paste the address exactly as shown.
      hostRange:
        default: 9700
        min: 9700
        max: 9799
    - key: query
      containerPort: 2457
      protocol: udp
      mirror: true
      follows:
        key: game
        offset: 1
      name:
        ar: الاستعلام
        en: Query
      hint:
        ar: منفذ الاستعلام، ومنه يظهر سيرفرك في قائمة سيرفرات فالهايم. لا يكتبه اللاعب أبدًا.
        en: The query port. It's how your server shows up in the Valheim server browser. Players never type it.
      hostRange:
        default: 9701
        min: 9701
        max: 9800

backup:
  only:
    - save/**
    - .serverk-settings.json
    - BepInEx/**
    - doorstop_libs/**
    - doorstop_config.ini
    - .doorstop_version
    - winhttp.dll
    - start_game_bepinex.sh
    - start_server_bepinex.sh
    - .serverk-bepinex.json
    - .serverk-mods.json
  except:
    - save/**/*.db.new
    - save/**/*.fwl.new
    - BepInEx/LogOutput.log
    - BepInEx/cache/**
    - save/**/*_backup_auto-*.db
    - save/**/*_backup_auto-*.fwl
    - save/**/*.db.old
    - save/**/*.fwl.old

secrets:
  - key: STEAM_WEB_API_KEY
    description:
      ar: مفتاح Steam Web API الخاص بالمنصة، ونجلب به أسماء حسابات Steam وصورها في جداول اللاعبين والأدمن والمحظورين.
      en: The platform's Steam Web API key. It reads Steam account names and avatars for the players, admins and bans tables.
    required: false

reset:
  keep:
    - .steamcmd
    - .steam
    - .config
    - Steam
    - steamapps
    - docker
    - linux64
    - valheim_server.x86_64
    - valheim_server_Data
    - "*.so*"
    - "*.debug"
    - start_server.sh
    - start_server_xterm.sh
    - docker_start_server.sh
    - steam_appid.txt
    - Valheim Dedicated Server Manual.pdf

presence:
  name: player
  id: platformId
  avatar: "https://avatars.steamstatic.com/{avatarHash}_full.jpg"
  fields:
    - key: account
      label:
        ar: الحساب
        en: Account
    - key: platform
      label:
        ar: المنصة
        en: Platform

files:
  protected:
    - .steamcmd
    - .steam
    - Steam
    - steamapps
    - valheim_server.x86_64
    - valheim_server_Data
    - linux64
    - UnityPlayer.so
    - steamclient.so
    - .serverk-install.json
    - .serverk-mods.json
    - .serverk-bepinex.json
  notable:
    - match: .serverk-settings.json
      label:
        ar: إعدادات السيرفر
        en: Server settings
      icon: settings
      color: "#c9873f"
      restart: true
      note:
        ar: كل إعدادات سيرفرك، من الاسم وكلمة المرور إلى الماب وقواعد اللعب. لا يوجد لفالهايم ملف إعدادات خاص به، بل تصله كل الإعدادات كأوامر تشغيل، وهذا الملف مصدرها. الأسهل تعديلها من تبويب الإعدادات، ويُطبَّق أي تعديل بعد الريستارت.
        en: Every setting your server runs on, from the name and password to the world and its rules. Valheim has no config file of its own. Everything reaches it as start parameters, and this file is where they come from. The settings tab is the easier way, and any change needs a restart.
    - match: save/worlds_local
      label:
        ar: ماباتك
        en: Your worlds
      icon: map
      color: "#5ba32b"
      note:
        ar: كل ماب من ملفين، ‎.db فيه كل ما بُني، و ‎.fwl فيه سيد الماب وقواعدها. لا تحذف أحدهما وتترك الآخر، وخذ نسخة احتياطية قبل أي تعديل هنا.
        en: Each world is two files. The .db holds everything built, the .fwl holds the seed and the world rules. Never delete one and keep the other, and take a backup before you touch anything here.
    - match: save/adminlist.txt
      label:
        ar: الأدمن
        en: Admins
      icon: shield
      color: "#4a8fd4"
      restart: true
      note:
        ar: معرّفات الأدمن (Platform User ID)، معرّف في كل سطر. للاعبي Steam يكون المعرّف V_ ثم رقم Steam64، ولم يعد رقم Steam وحده يمنح صلاحية الأدمن منذ الإصدار 1.0. يفتح كل من في هذا الملف كونسول الأدمن داخل اللعبة بزر F5، وصفحة اللاعبين أسهل من تعديله يدويًا.
        en: The Platform User IDs of your admins, one per line. On Steam that's V_ followed by the Steam64 ID. A bare Steam number stopped granting admin in 1.0. Anyone here unlocks the in-game admin console on F5, and the Players page is easier than editing it by hand.
    - match: save/bannedlist.txt
      label:
        ar: المحظورون
        en: Bans
      icon: sword
      color: "#c77dff"
      restart: true
      note:
        ar: المعرّفات الممنوعة من الدخول، بصيغة Platform User ID نفسها. يقرأ فالهايم الملف عند التشغيل، فلإخراج لاعب متصل الآن يلزم ريستارت بعد الإضافة.
        en: The Platform User IDs that can't join. Valheim reads this at start, so a new entry needs a restart to drop somebody who is already on.
    - match: save/permittedlist.txt
      label:
        ar: القائمة البيضاء
        en: Allow list
      icon: users
      color: "#4ac2a0"
      restart: true
      note:
        ar: بمجرد كتابة معرّف واحد هنا، لا يدخل سيرفرك إلا من في هذه القائمة. اتركه فارغًا إذا أردت أن يدخل الجميع بكلمة المرور.
        en: Put a single Platform User ID here and nobody outside this list can join. Leave it empty to let anyone with the password in.
    - match: BepInEx/plugins
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#d05353"
      restart: true
      note:
        ar: كل مود في مجلد باسمه. الأفضل تثبيت المودات من تبويب المودات، فمن هناك ننزّل مع المود كل ما يعتمد عليه.
        en: Each mod sits in its own folder. Installing from the mods tab is better, because it pulls everything the mod depends on with it.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: worlds
    name:
      ar: المابات
      en: Worlds
  - id: mods
    name:
      ar: المودات
      en: Mods

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر فالهايم، واضبط كلمة المرور، وادخله مع أصحابك بالعنوان أو بكود الكروس بلاي.
      en: Create your Valheim server, set the password, and get in with your friends by address or by crossplay code.
    tags:
      - start
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: worlds
    title:
      ar: رفع المابات وتبديلها وإنشاء ماب جديدة
      en: Upload, switch and start fresh worlds
    summary:
      ar: ارفع مابك من جهازك، وبدّل بين ماباتك، أو أنشئ ماب جديدة دون أن تخسر القديمة.
      en: Upload the world from your own game, switch between worlds, or start a fresh one without losing the old.
    tags:
      - worlds
    surfaces:
      - panel
      - files
      - backups
    bodyPath:
      ar: guides/worlds/ar.md
      en: guides/worlds/en.md
  - id: mods
    title:
      ar: المودات و BepInEx
      en: Mods and BepInEx
    summary:
      ar: ثبّت BepInEx بضغطة واحدة، وثبّت مودات Thunderstore على سيرفرك، ودع أصحابك يثبّتون المودات نفسها.
      en: Install BepInEx in one click, put Thunderstore mods on your server, and get your friends onto the same list.
    tags:
      - mods
    surfaces:
      - panel
      - files
    bodyPath:
      ar: guides/mods/ar.md
      en: guides/mods/en.md
